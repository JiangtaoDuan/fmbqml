[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fmbqml"
version = "0.1.7"
description = "Structural-break detection in high-dimensional factor models using QML methods."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Liting Chen"},
    {name = "Jiangtao Duan"},
    {name = "Xu Han"},
]
keywords = [
    "factor models",
    "structural breaks",
    "QML",
    "high-dimensional data",
]
dependencies = [
    "numpy>=1.21.6",
    "scipy>=1.7.3",
    "pandas>=1.3.5",
    "matplotlib>=3.5.0",
    "joblib>=1.1.0",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/JiangtaoDuan/fmbqml"
Repository = "https://github.com/JiangtaoDuan/fmbqml"
Issues = "https://github.com/JiangtaoDuan/fmbqml/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["fmbqml*"]
exclude = ["fmbqml.tests*", "tests*", "examples*", "replication*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
docs = [
    "sphinx>=7.2",
    "furo>=2024.1.29",
]
